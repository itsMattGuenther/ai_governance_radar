name: Publish site

# Rebuilds the public read-only site (DEC-029) and deploys it to Cloudflare (DEC-032):
# collect from sources → save the database → build the SPA → export the JSON snapshot.
# The SQLite database persists between runs on the `radar-data` branch as a single
# force-pushed commit, so repository history never grows.

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours; sources poll every 6–24 h
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/**"
      - "wrangler.jsonc"
      - ".github/workflows/publish.yml"

permissions:
  contents: write # push the database snapshot to the data branch

concurrency:
  group: publish-site
  cancel-in-progress: false # never interrupt a run mid-way through saving the database

env:
  DATA_BRANCH: radar-data
  DEMO_DATA: "false" # the public site never contains demo data
  USER_AGENT: ai-governance-radar/0.1 (+https://github.com/${{ github.repository }})

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }

      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Restore the database
        run: |
          if git fetch --depth=1 origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH" 2>/dev/null; then
            git show "origin/$DATA_BRANCH:radar.db" > data/radar.db
            echo "Restored database ($(du -h data/radar.db | cut -f1))"
          else
            echo "No $DATA_BRANCH branch yet: starting a fresh database"
          fi

      - name: Install the backend
        working-directory: backend
        run: pip install -e . # editable: config resolves data/ relative to the checkout

      - name: Load sources and curated records
        # Upserts, so edits to data/seed/*.json or data/sources/sources.yaml land here.
        working-directory: backend
        run: python -m app.cli seed

      - name: Collect from sources
        # A failing feed is recorded and shown on the Source Health page rather than
        # blocking the publish; an unexpected crash still fails the run.
        working-directory: backend
        run: python -m app.cli ingest --tolerate-source-errors

      - name: Save the database for the next run
        # Saved before the site build so a broken build never loses collected data.
        working-directory: backend
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          python -m app.cli backup "$RUNNER_TEMP/radar.db"
          db=$(git hash-object -w --no-filters "$RUNNER_TEMP/radar.db")
          readme=$(printf '%s\n' "Database snapshot written by .github/workflows/publish.yml." \
            "Replaced on every run; not meant for manual edits." | git hash-object -w --stdin)
          tree=$(printf '100644 blob %s\tREADME.md\n100644 blob %s\tradar.db\n' "$readme" "$db" | git mktree)
          commit=$(git commit-tree "$tree" -m "Database snapshot $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force origin "$commit:refs/heads/$DATA_BRANCH"

      - name: Build the site
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:static

      - name: Export the data snapshot
        working-directory: backend
        run: python -m app.cli export-static --out ../frontend/dist-static/data

      # wrangler.jsonc serves the build at aigov.mattguenther.com. Deep links return the
      # app with HTTP 200 (single-page-application fallback), and frontend/public/_headers
      # sets the security headers.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.168.0"
          command: deploy
